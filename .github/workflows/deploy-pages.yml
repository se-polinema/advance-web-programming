# Build slides + jobsheets from source and publish to GitHub Pages.
#
# Runs on GitHub-hosted `ubuntu-latest` runners -- a fresh VM per run, so
# every dependency (LaTeX toolchain, emoji font) is installed inline below
# rather than assumed pre-installed. Slide decks are rendered via the
# official marpteam/marp-cli Docker image (ubuntu-latest ships Docker by
# default) instead of `npx @marp-team/marp-cli` directly, since that image
# bundles its own Chromium for PDF export -- no system browser to manage.
#
# One-time manual step: repo Settings -> Pages -> Source must be set to
# "GitHub Actions" (requires the repo be public, or GitHub Enterprise, for
# org repos).

name: Deploy Pages (Slides & Jobsheets)

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - 'jobsheets/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jobsheet toolchain (pandoc + LaTeX + emoji font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-luatex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            fonts-dejavu fonts-symbola

      - name: Prepare output directory
        run: |
          rm -rf _site
          mkdir -p _site/slides/id _site/slides/en _site/jobsheets

      - name: Pull Marp CLI image
        run: docker pull marpteam/marp-cli

      - name: Build slide decks
        run: |
          # marpteam/marp-cli's entrypoint prepends `node` to whatever args
          # `docker run` is given, expecting the image's default CMD (the
          # marp-cli.js path) to still be first -- but passing our own args
          # replaces CMD entirely per normal `docker run` semantics, so the
          # script path has to be supplied explicitly here (confirmed by
          # testing locally: omitting it silently no-ops instead of erroring).
          shopt -s nullglob
          for lang in id en; do
            for md in "slides/$lang"/bab*.md; do
              slug="$(basename "$md" .md)"
              echo "==> $lang/$slug"
              docker run --rm --init -v "$PWD:/home/marp/app" -e LANG="$LANG" --entrypoint node \
                marpteam/marp-cli /home/marp/.cli/marp-cli.js "$md" --html --allow-local-files -o "_site/slides/$lang/${slug}.html"
              docker run --rm --init -v "$PWD:/home/marp/app" -e LANG="$LANG" --entrypoint node \
                marpteam/marp-cli /home/marp/.cli/marp-cli.js "$md" --pdf --allow-local-files -o "_site/slides/$lang/${slug}.pdf"
            done
          done

      - name: Build jobsheets
        working-directory: jobsheets
        run: ./build.sh

      - name: Copy jobsheet outputs
        run: |
          cp jobsheets/build/*.pdf _site/jobsheets/
          cp jobsheets/pertemuan-*.md _site/jobsheets/

      - name: Generate index page
        run: ./scripts/build-pages-index.sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
