name: Build Book PDFs

on:
  release:
    types: [published]

jobs:
  build-full:
    name: Build Full Book (${{ matrix.lang }})
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        lang: [id, en]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full book
        working-directory: book
        run: |
          # On a fresh checkout (no cached .bbl), latexmk's first pass hits
          # undefined-references noise before biber resolves the
          # bibliography; $force_mode papers over it but still exits
          # non-zero. The PDF from that first pass is already fine — this
          # just gets a clean exit code on the second pass.
          make ${{ matrix.lang }} || true
          make ${{ matrix.lang }}

      - name: Check for LaTeX errors
        working-directory: book
        run: |
          if grep -l "LaTeX Error\|Undefined control sequence" book-${{ matrix.lang }}.log; then
            echo "LaTeX errors found in build log"
            exit 1
          fi

      - name: Rename PDF with release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cp "book/book-${{ matrix.lang }}.pdf" "book-${{ matrix.lang }}-${VERSION}.pdf"

      - name: Upload full book to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          gh release upload "$VERSION" "book-${{ matrix.lang }}-${VERSION}.pdf" --clobber

  build-chapters:
    name: Build Chapter (${{ matrix.lang }}, ${{ matrix.chapter }})
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        lang: [id, en]
        chapter:
          - chapter01-arsitektur-web-modern
          - chapter02-http-dan-mvc
          - chapter03-blade-dan-tailwind
          - chapter04-desain-basis-data
          - chapter05-eloquent-dan-relasi
          - chapter06-validasi-input
          - chapter07-autentikasi-dan-otorisasi
          - chapter08-pengolahan-data
          - chapter09-membangun-rest-api
          - chapter10-pengujian-aplikasi
          - chapter11-optimasi-dan-deployment
          - chapter12-studi-kasus-menyeluruh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build chapter
        working-directory: book
        run: |
          # Same fresh-checkout $force_mode quirk as the full book build —
          # build-chapter.sh also runs latexmk -bibtex under the hood. For
          # some chapters (confirmed with chapter04-desain-basis-data)
          # latexmk's own exit code stays non-zero even after several
          # reruns despite producing a fully correct PDF and log with no
          # real errors — running the script twice doesn't fix it (the
          # second invocation just replays the first's cached error via
          # "Nothing to do"). So don't trust the script's exit code at all;
          # `|| true` here and let the next step verify the actual PDF and
          # log content instead.
          ./scripts/build-chapter.sh ${{ matrix.lang }} ${{ matrix.chapter }} || true

      - name: Check for LaTeX errors and confirm PDF exists
        working-directory: book
        run: |
          PDF="output/chapters/chapter-${{ matrix.lang }}-${{ matrix.chapter }}.pdf"
          LOG="output/chapters/chapter-${{ matrix.lang }}-${{ matrix.chapter }}.log"
          if [ ! -f "$PDF" ]; then
            echo "PDF was not generated: $PDF"
            exit 1
          fi
          if grep -l "LaTeX Error\|Undefined control sequence" "$LOG"; then
            echo "LaTeX errors found in build log"
            exit 1
          fi

      - name: Rename chapter PDF with release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          SRC="book/output/chapters/chapter-${{ matrix.lang }}-${{ matrix.chapter }}.pdf"
          DEST="chapter-${{ matrix.lang }}-${{ matrix.chapter }}-${VERSION}.pdf"
          cp "$SRC" "$DEST"

      - name: Upload chapter to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          gh release upload "$VERSION" "chapter-${{ matrix.lang }}-${{ matrix.chapter }}-${VERSION}.pdf" --clobber
