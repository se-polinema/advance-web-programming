name: Build Book PDFs

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build book PDFs
        working-directory: book
        run: |
          # On a fresh checkout (no cached .bbl), latexmk's first pass hits
          # undefined-references noise before biber resolves the bibliography;
          # $force_mode papers over it but still exits non-zero. The PDF from
          # that first pass is already fine — this just gets a clean exit code.
          make both || true
          make both

      - name: Check for LaTeX errors
        working-directory: book
        run: |
          if grep -l "LaTeX Error\|Undefined control sequence" book-id.log book-en.log; then
            echo "LaTeX errors found in build log"
            exit 1
          fi

      - name: Upload PDFs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" book/book-id.pdf book/book-en.pdf --clobber
