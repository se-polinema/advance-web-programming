name: Build Book PDFs

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build book PDFs
        working-directory: book
        run: |
          # On a fresh checkout (no cached .bbl), each language's first
          # latexmk pass hits undefined-references noise before biber
          # resolves the bibliography; $force_mode papers over it but still
          # exits non-zero. `make both` stops at the first failing target,
          # so id and en each need their own two-pass treatment rather than
          # running `make both` twice as a whole (which only warms id before
          # en hits the same fresh-checkout issue for the first time).
          make id || true
          make id
          make en || true
          make en

      - name: Check for LaTeX errors
        working-directory: book
        run: |
          if grep -l "LaTeX Error\|Undefined control sequence" book-id.log book-en.log; then
            echo "LaTeX errors found in build log"
            exit 1
          fi

      - name: Upload PDFs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" book/book-id.pdf book/book-en.pdf --clobber
